<!doctype html>
<html lang="en" class="overlay" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quotis</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="island" data-mode="island" data-state="none" aria-label="Quotis AI usage">
      <div id="bar">
        <button id="pill" type="button" aria-expanded="false" aria-controls="list">
          <span id="pill-content">
            <span id="pill-dot" class="dot" data-level="unknown" aria-hidden="true"></span>
            <span id="pill-name">Quotis</span>
            <span id="pill-value"></span>
            <span id="pill-others" aria-hidden="true"></span>
          </span>
        </button>
        <div id="actions" inert>
          <button id="refresh" type="button" class="icon-btn" aria-label="Refresh now" title="Refresh now">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-3-6.7" />
              <path d="M21 4v5h-5" />
            </svg>
          </button>
          <button id="open-settings" type="button" class="icon-btn" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4" />
              <circle cx="16" cy="6" r="2" />
              <circle cx="8" cy="12" r="2" />
              <circle cx="14" cy="18" r="2" />
            </svg>
          </button>
          <button id="quit" type="button" class="icon-btn" aria-label="Quit Quotis" title="Quit Quotis">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
      </div>
      <ul id="list" inert aria-label="Providers"></ul>
      <p id="live" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
