<!doctype html>
<html lang="en" class="glass-window widget">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quotis</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main data-tauri-drag-region class="lg h-screen w-screen select-none overflow-hidden">
      <!-- Real blur: main.js paints the blurred screen behind the widget into this canvas, clipped
           to each [data-glass] tile. The space between tiles stays clear. -->
      <canvas id="backdrop" class="pointer-events-none fixed inset-0 -z-10 size-full"></canvas>
      <!-- All sizes are rem-based; main.js scales the root font-size so this block always fits the window. -->
      <div id="fit" class="flex flex-col gap-2 p-2.5">
        <header class="flex h-5 items-center justify-between">
          <span data-glass class="lg-chip px-2.5 py-0.5 text-[0.625rem] font-semibold uppercase tracking-[0.18em] text-ink/75">Quotis</span>
          <div class="hover-reveal flex items-center gap-1.5">
            <button data-open-settings aria-label="Settings" title="Settings" class="lg-btn grid size-5 place-items-center text-ink/85">
              <svg viewBox="0 0 24 24" class="size-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
              </svg>
            </button>
            <button id="close" aria-label="Quit" title="Quit" class="lg-btn grid size-5 place-items-center text-sm leading-none text-ink/85">×</button>
          </div>
        </header>
        <ul id="list" class="flex flex-col gap-2"></ul>
      </div>
      <button id="grip" aria-label="Resize" class="hover-reveal absolute bottom-1.5 right-1.5 size-3 cursor-se-resize text-ink/50">
        <svg viewBox="0 0 12 12" class="size-full" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M11 4 4 11M11 8 8 11" />
        </svg>
      </button>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
