<!doctype html>
<html lang="en" class="glass-window">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quotis Settings</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="text-[13px] [color-scheme:dark]">
    <!-- Settings is a form: it keeps a readable tint no matter how clear the widget is set. -->
    <div class="lg settings-panel flex h-screen flex-col">
      <header data-tauri-drag-region class="flex items-center justify-between px-5 pb-2 pt-4">
        <span data-tauri-drag-region class="text-[15px] font-semibold">Settings</span>
        <button id="close" aria-label="Close settings" class="lg-btn grid size-6 place-items-center leading-none">×</button>
      </header>

      <main class="lg-scroll flex-1 space-y-5 overflow-y-auto px-4 pb-5">
        <section class="space-y-1.5">
          <h2 class="px-3 text-[11px] uppercase tracking-wider text-ink/50">Connections</h2>
          <div id="tools" class="lg-group"></div>
          <p class="px-3 text-[11px] leading-relaxed text-ink/60">
            Leave a folder empty to auto-detect it. Tools that are off or not found are hidden from the widget.
          </p>
        </section>

        <section class="space-y-1.5">
          <h2 class="px-3 text-[11px] uppercase tracking-wider text-ink/50">Appearance</h2>
          <div class="lg-group">
            <label class="flex items-center justify-between gap-4 px-3.5 py-2.5">
              Theme
              <select id="theme" class="lg-field px-2.5 py-1">
                <option value="system">System</option>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
              </select>
            </label>
            <label class="flex items-center justify-between gap-4 px-3.5 py-2.5">
              <span>Glass opacity <span class="block text-[11px] text-ink/60">How frosted the cards are. Text stays readable at any level.</span></span>
              <span class="flex items-center gap-2.5">
                <input id="glass_opacity" type="range" min="0" max="100" class="lg-range w-28" />
                <output id="glass_out" class="w-9 text-right tabular-nums text-ink/60"></output>
              </span>
            </label>
            <label class="flex items-center justify-between gap-4 px-3.5 py-2.5">
              <span>Real blur <span class="block text-[11px] text-ink/60">Blurs what's behind the tiles, like iOS. Also hides the widget from screenshots and screen sharing.</span></span>
              <input id="blur" type="checkbox" class="lg-switch" />
            </label>
            <label class="flex items-center justify-between gap-4 px-3.5 py-2.5">
              Keep on top
              <input id="always_on_top" type="checkbox" class="lg-switch" />
            </label>
            <label class="flex items-center justify-between gap-4 px-3.5 py-2.5">
              Bars show
              <select id="show_used" class="lg-field px-2.5 py-1">
                <option value="left">% left</option>
                <option value="used">% used</option>
              </select>
            </label>
          </div>
        </section>

        <section class="space-y-1.5">
          <h2 class="px-3 text-[11px] uppercase tracking-wider text-ink/50">Refresh</h2>
          <div class="lg-group">
            <label class="flex items-center justify-between gap-4 px-3.5 py-2.5">
              Check Claude every
              <span class="flex items-center gap-2 text-ink/60">
                <input id="refresh" type="number" min="1" max="60" class="lg-field w-14 px-2 py-1 text-right text-ink" />
                min
              </span>
            </label>
          </div>
          <p class="px-3 text-[11px] leading-relaxed text-ink/60">
            Codex and Gemini update instantly. Nothing is uploaded: the only request is Claude's limit check to
            api.anthropic.com, using your Claude Code login.
          </p>
        </section>

        <p id="saved" class="h-4 px-3 text-[11px] text-ok"></p>
      </main>
    </div>
    <script type="module" src="/src/settings.js"></script>
  </body>
</html>
