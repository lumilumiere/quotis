# Builds installers and the quotis-cli binary for Windows, macOS and Linux when a version tag
# (e.g. v2.0.0) is pushed, and attaches them with SHA-256 checksums to a DRAFT GitHub release
# for you to review and publish. It never overwrites a published release.
#
# Signing is optional. With none of the secrets below set, the build succeeds and the
# installers are UNSIGNED (the checksums file says so). To sign:
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID   (signing + notarization)
#   Windows: configure bundle.windows.signCommand or certificateThumbprint in
#            src-tauri/tauri.conf.json for your certificate provider.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "v$version" = "${{ github.ref_name }}" || { echo "tag ${{ github.ref_name }} does not match version $version"; exit 1; }

      - name: Test
        run: |
          npm test
          npm run build
          cargo test --workspace --locked

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Quotis ${{ github.ref_name }}"
          releaseBody: "Built by GitHub Actions from commit ${{ github.sha }}. Verify downloads against the SHA256SUMS files below. See docs/INSTALL.md for first-launch notes and signing status."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Build quotis-cli
        run: cargo build --release --locked -p quotis-cli --target ${{ matrix.target }}

      - name: Checksums and CLI upload
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && runner.os == 'macOS' }}
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cli="quotis-cli-${{ matrix.target }}$ext"
          cp "target/${{ matrix.target }}/release/quotis-cli$ext" "$cli"
          sums="SHA256SUMS-${{ matrix.target }}.txt"
          hash() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
          {
            echo "# Quotis ${{ github.ref_name }} ${{ matrix.target }}"
            echo "# commit ${{ github.sha }}  code-signed: $SIGNED"
            echo "$(hash "$cli")  $cli"
            node -e 'for (const p of JSON.parse(process.env.ARTIFACTS || "[]")) console.log(p)' | while read -r f; do
              [ -f "$f" ] && echo "$(hash "$f")  $(basename "$f")"
            done
          } > "$sums"
          cat "$sums"
          gh release upload "${{ github.ref_name }}" "$cli" "$sums" --clobber
